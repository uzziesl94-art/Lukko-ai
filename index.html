<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUKKO AI</title></head>
<body>
<div id="chat"></div>
<input id="msg" placeholder="Type message..."><button onclick="send()">Send</button>
<script>
async function send(){
  const m=document.getElementById('msg').value;
  if(!m)return;
  document.getElementById('chat').innerHTML+=`<div>You: ${m}</div>`;
  document.getElementById('msg').value='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});
    const d=await r.json();
    document.getElementById('chat').innerHTML+=`<div>LUKKO: ${d.reply}</div>`;
  }catch(e){ document.getElementById('chat').innerHTML+=`<div style="color:red">Network failed - ${e.message}</div>`; }
}
</script>
</body></html>
